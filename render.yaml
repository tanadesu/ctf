services:
  - type: web
    name: orbis-mars-api
    runtime: node
    plan: free
    buildCommand: node --check server.js && node --check simulation.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://ctf1-99feb.web.app,https://ctf1-99feb.firebaseapp.com
      - key: ADMIN_KEY
        generateValue: true
